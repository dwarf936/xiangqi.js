<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>中国象棋测试</title>
    <style>
        table { border-collapse: collapse; margin: 20px auto; }
        td { width: 50px; height: 50px; border: 1px solid black; text-align: center; font-size: 30px; background-color: #f0d9b5; }
        td.dark { background-color: #b58863; }
    </style>
</head>
<body>
    <h1 style="text-align: center;">中国象棋测试</h1>
    <table id="board"></table>

    <script src="xiangqi.js"></script>
    <script>
        // 初始化游戏
        const game = new Xiangqi();
        console.log('Game initialized');
        
        // 棋子符号映射
        const pieceSymbols = {
            'r': { 'k': '帅', 'a': '仕', 'b': '相', 'n': '马', 'r': '车', 'c': '炮', 'p': '兵' },
            'b': { 'k': '将', 'a': '士', 'b': '象', 'n': '馬', 'r': '車', 'c': '砲', 'p': '卒' }
        };
        
        // 渲染棋盘
        function render() {
            const boardElement = document.getElementById('board');
            boardElement.innerHTML = '';
            
            const letters = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h', 'i'];
            const numbers = ['9', '8', '7', '6', '5', '4', '3', '2', '1', '0'];
            
            for (let row = 0; row < 10; row++) {
                const tr = document.createElement('tr');
                for (let col = 0; col < 9; col++) {
                    const td = document.createElement('td');
                    if ((row + col) % 2 === 1) td.className = 'dark';
                    
                    const square = letters[col] + numbers[row];
                    const piece = game.get(square);
                    
                    if (piece) {
                        td.textContent = pieceSymbols[piece.color][piece.type];
                    }
                    
                    tr.appendChild(td);
                }
                boardElement.appendChild(tr);
            }
        }
        
        // 渲染棋盘
        render();
    </script>
</body>
</html>
