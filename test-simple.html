<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>测试象棋棋子显示</title>
    <style>
        table { border-collapse: collapse; margin: 20px; }
        td { width: 50px; height: 50px; border: 1px solid black; text-align: center; font-size: 30px; }
    </style>
</head>
<body>
    <h1>测试象棋棋子显示</h1>
    <table id="test-board"></table>
    <div id="test-results"></div>

    <script src="xiangqi.js"></script>
    <script>
        // 测试代码
        const game = new Xiangqi();
        console.log('Game initialized');
        
        // 测试几个关键位置的棋子
        const testSquares = ['a9', 'b9', 'c9', 'd9', 'e9', 'f9', 'g9', 'h9', 'i9', 'a0', 'b0', 'c0', 'd0', 'e0', 'f0', 'g0', 'h0', 'i0', 'e5'];
        
        let results = '<h2>测试结果：</h2>';
        for (let square of testSquares) {
            const piece = game.get(square);
            results += `<p>${square}: ${piece ? JSON.stringify(piece) : '空'}</p>`;
        }
        
        document.getElementById('test-results').innerHTML = results;
        
        // 渲染简单棋盘
        const boardElement = document.getElementById('test-board');
        const pieceSymbols = { 'r': { 'k': '帅', 'a': '仕', 'b': '相', 'n': '马', 'r': '车', 'c': '炮', 'p': '兵' }, 'b': { 'k': '将', 'a': '士', 'b': '象', 'n': '馬', 'r': '車', 'c': '砲', 'p': '卒' } };
        
        for (let row = 0; row < 10; row++) {
            const tr = document.createElement('tr');
            for (let col = 0; col < 9; col++) {
                const td = document.createElement('td');
                const letters = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h', 'i'];
                const number = 9 - row;
                const square = letters[col] + number;
                
                const piece = game.get(square);
                if (piece) {
                    td.textContent = pieceSymbols[piece.color][piece.type];
                }
                
                tr.appendChild(td);
            }
            boardElement.appendChild(tr);
        }
    </script>
</body>
</html>
